name: Release

# A v* tag builds every bundle, installs it on a real Mac and Windows machine,
# then creates a draft GitHub Release. Check the notes and press Publish.
# Run it by hand (Actions → Release → Run workflow) to build and test without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Every version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$v"
          test "$(node -p 'require("./apps/extension/package.json").version')" = "$v"
          grep -q "APP_VERSION = \"$v\"" packages/core/src/constants.ts
      - run: pnpm test
      - run: pnpm --filter @no-fomo/web build
      - run: pnpm release:bundle
      - run: pnpm ext:zip && cp apps/extension/.output/no-fomo-extension-*.zip dist/release/no-fomo-extension.zip
      - name: FFmpeg source code (GPL requires it next to the binaries)
        run: curl -fsSL -o dist/release/ffmpeg-9.0.2.tar.xz https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.tar.xz
            dist/release/SHA256SUMS

  test-mac:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Install, check, uninstall
        env:
          NO_FOMO_NO_BROWSER: "1"
          NO_FOMO_DOWNLOAD_BASE: http://127.0.0.1:8000
        run: |
          python3 -m http.server 8000 --directory release >/dev/null 2>&1 &
          sleep 1
          bash scripts/install/install.sh
          curl -fsS http://localhost:4747/api/config | grep extensionId
          curl -fsS http://localhost:4747/ | grep -q '<title>no-fomo</title>'
          ~/.no-fomo/app/ffmpeg/ffprobe -version | head -1
          ~/.no-fomo/app/bin/no-fomo uninstall
          test ! -d ~/.no-fomo/app

  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Install, check, uninstall
        shell: powershell
        env:
          NO_FOMO_NO_BROWSER: "1"
          NO_FOMO_DOWNLOAD_BASE: http://127.0.0.1:8000
        run: |
          Start-Process -WindowStyle Hidden python -ArgumentList '-m', 'http.server', '8000', '--directory', 'release'
          Start-Sleep -Seconds 2
          Get-Content -Raw scripts/install/install.ps1 | Invoke-Expression
          $r = Invoke-WebRequest -UseBasicParsing http://localhost:4747/api/config
          if ($r.Content -notmatch 'extensionId') { throw 'server did not answer' }
          & "$env:USERPROFILE\.no-fomo\app\ffmpeg\ffprobe.exe" -version | Select-Object -First 1
          if (-not (Test-Path ([Environment]::GetFolderPath('Programs') + '\no-fomo.lnk'))) { throw 'no Start Menu shortcut' }
          & "$env:USERPROFILE\.no-fomo\app\bin\no-fomo.ps1" uninstall
          if (Test-Path "$env:USERPROFILE\.no-fomo\app") { throw 'app folder still there' }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-mac, test-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --generate-notes --title "no-fomo ${GITHUB_REF_NAME#v}"
